# Local dev/test only — not used in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: srenglish
      POSTGRES_PASSWORD: srenglish
      POSTGRES_DB: srenglish
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U srenglish"]
      interval: 2s
      timeout: 3s
      retries: 20
